<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GasPol - Cari SPBU Terdekat</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark navbar-gp sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Gas<span class="brand-dot">Pol</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="daftar.html">Daftar SPBU</a></li>
        <li class="nav-item"><a class="nav-link" href="form.html">Laporkan SPBU</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
    <div>
      <h1 class="h3 fw-bold mb-1">Cari SPBU Pertamina terdekat</h1>
      <p class="text-secondary mb-0" id="lokasi-status">Mengambil lokasimu...</p>
    </div>
    <button class="btn btn-gp" id="btn-lokasi" type="button">Gunakan lokasiku</button>
  </div>
  <div class="row g-3 mb-4">
    <div class="col-12 col-sm-4"><div class="card border-0 shadow-sm h-100"><div class="card-body">
      <div class="text-secondary small">SPBU terdata</div><div class="stat-num" id="stat-total">0</div></div></div></div>
    <div class="col-6 col-sm-4"><div class="card border-0 shadow-sm h-100"><div class="card-body">
      <div class="text-secondary small">Sedang buka</div><div class="stat-num" id="stat-buka">0</div></div></div></div>
    <div class="col-6 col-sm-4"><div class="card border-0 shadow-sm h-100"><div class="card-body">
      <div class="text-secondary small">Terdekat darimu</div><div class="stat-num" id="stat-dekat">-</div></div></div></div>
  </div>
  <div class="row g-3">
    <div class="col-12 col-lg-8"><div id="map"></div></div>
    <div class="col-12 col-lg-4">
      <h2 class="h5 fw-bold">3 SPBU terdekat</h2>
      <div class="d-grid gap-2" id="list-terdekat"></div>
      <a href="daftar.html" class="btn btn-outline-primary w-100 mt-3">Lihat semua SPBU</a>
    </div>
  </div>
</main>

<footer class="text-center small py-4">&copy; 2026 GasPol - Tugas Pengembangan Aplikasi Fullstack</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>initDashboard();</script>
</body>
</html>
