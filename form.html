<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GasPol - Laporkan SPBU</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark navbar-gp sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Gas<span class="brand-dot">Pol</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="daftar.html">Daftar SPBU</a></li>
        <li class="nav-item"><a class="nav-link active" href="form.html">Laporkan SPBU</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="row justify-content-center"><div class="col-12 col-lg-8">
    <h1 class="h3 fw-bold">Laporkan atau tambah SPBU</h1>
    <p class="text-secondary">Bantu pengguna lain dengan data terbaru soal kondisi, harga, atau SPBU baru.</p>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <form action="#" method="post" class="row g-3" onsubmit="event.preventDefault();alert('Data belum dikirim: backend belum terhubung.')">
        <div class="col-12 col-md-6"><label for="nomor" class="form-label">Nomor SPBU</label>
          <input type="text" id="nomor" class="form-control" placeholder="31.123.01" required></div>
        <div class="col-12 col-md-6"><label for="kota" class="form-label">Kota</label>
          <select id="kota" class="form-select" required><option value="">Pilih kota</option>
            <option>Bandung</option><option>Jakarta</option><option>Surabaya</option><option>Lainnya</option></select></div>
        <div class="col-12"><label for="alamat" class="form-label">Alamat</label>
          <input type="text" id="alamat" class="form-control" placeholder="Jl. Merdeka No. 10" required></div>
        <div class="col-6"><label for="lat" class="form-label">Latitude</label>
          <input type="number" step="any" id="lat" class="form-control" placeholder="-6.9175"></div>
        <div class="col-6"><label for="lng" class="form-label">Longitude</label>
          <input type="number" step="any" id="lng" class="form-control" placeholder="107.6191"></div>
        <div class="col-12"><label for="status" class="form-label">Status operasional</label>
          <select id="status" class="form-select"><option>Buka 24 jam</option><option>Buka terbatas</option><option>Tutup / perbaikan</option></select></div>
        <fieldset class="col-12"><legend class="form-label fs-6">BBM yang tersedia</legend>
          <div class="row row-cols-2 row-cols-md-3 g-2">
            <div class="col"><div class="form-check"><input class="form-check-input" type="checkbox" id="b1"><label class="form-check-label" for="b1">Pertalite</label></div></div>
            <div class="col"><div class="form-check"><input class="form-check-input" type="checkbox" id="b2"><label class="form-check-label" for="b2">Solar</label></div></div>
            <div class="col"><div class="form-check"><input class="form-check-input" type="checkbox" id="b3"><label class="form-check-label" for="b3">Pertamax</label></div></div>
            <div class="col"><div class="form-check"><input class="form-check-input" type="checkbox" id="b4"><label class="form-check-label" for="b4">Pertamax Green</label></div></div>
            <div class="col"><div class="form-check"><input class="form-check-input" type="checkbox" id="b5"><label class="form-check-label" for="b5">Pertamax Turbo</label></div></div>
            <div class="col"><div class="form-check"><input class="form-check-input" type="checkbox" id="b6"><label class="form-check-label" for="b6">Dexlite</label></div></div>
          </div></fieldset>
        <div class="col-12"><label for="catatan" class="form-label">Catatan (antrean, fasilitas)</label>
          <textarea id="catatan" class="form-control" rows="3"></textarea></div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-gp">Simpan data SPBU</button>
          <button type="reset" class="btn btn-outline-secondary">Batal</button></div>
      </form>
    </div></div>
  </div></div>
</main>

<footer class="text-center small py-4">&copy; 2026 GasPol - Tugas Pengembangan Aplikasi Fullstack</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>
</body>
</html>
